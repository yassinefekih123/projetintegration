name: CI

on:
  push:
    branches: [ main, master, feat/frontend-toasts ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run Maven tests
        # Print diagnostics and run Maven with verbose output; upload mvn log
        - name: Print Java and Maven versions
          run: |
            java -version || true
            mvn -version || true
            env | sort
        - name: Run Maven tests (verbose)
          working-directory: ./backend
          run: |
            bash -lc "mvn -B -DskipTests=false -e -X test | tee mvn-test.log; exit ${PIPESTATUS[0]}"
        - name: Upload Maven log
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: backend-mvn-log
            path: backend/mvn-test.log
      - name: Publish JUnit results to PR
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: backend-maven-tests
          path: backend/target/surefire-reports/*.xml
          reporter: junit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend-e2e:
    name: Frontend Cypress E2E
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      # Removed background start to avoid double-starting the server
      # Cypress action will start the app itself using the `start` option below.
      - name: Run Cypress tests (official action)
        uses: cypress-io/github-action@v5
        with:
          start: cd frontend && npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 120
      - name: Upload Cypress video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: frontend/cypress/results || frontend/cypress/videos
